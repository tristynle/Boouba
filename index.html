<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Boba Merge</title>
<style>
  :root{--bg:#ede4f7;--ink:#3b2a4d;--card:#fff;--accent:#7a4fb5}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Trebuchet MS","Avenir Next Rounded",system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
  #app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
  h1{margin:0;font-size:2rem;letter-spacing:.5px}
  #bar{display:flex;gap:10px}
  .box{background:var(--card);border-radius:14px;padding:6px 16px;text-align:center;min-width:84px}
  .box small{display:block;font-size:.7rem;opacity:.65}
  .box b{font-size:1.3rem}
  #main{display:flex;gap:12px;align-items:flex-start}
  #wrap{position:relative}
  canvas{display:block}
  #c{border-radius:18px;background:#cdb8e6}
  #side{width:92px;display:flex;flex-direction:column;align-items:center;gap:4px}
  #stage{font-size:.72rem;text-align:center;line-height:1.25;min-height:2.6em;font-weight:700}
  .overlay{position:absolute;inset:0;border-radius:18px;background:rgba(237,228,247,.94);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
  .overlay.hide{display:none}
  .overlay h2{margin:0;font-size:1.7rem}
  .overlay p{margin:0;font-size:.95rem;max-width:260px;line-height:1.4}
  button{font:inherit;font-weight:700;border:0;border-radius:999px;background:var(--accent);color:#fff;
    padding:12px 30px;font-size:1.1rem;cursor:pointer}
  button:active{transform:scale(.96)}
  button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  #hint{font-size:.8rem;opacity:.7;margin:0}
</style>
</head>
<body>
<div id="app">
  <h1>Boba Merge</h1>
  <div id="bar">
    <div class="box"><small>Score</small><b id="score">0</b></div>
    <div class="box"><small>Best</small><b id="best">0</b></div>
  </div>
  <div id="main">
    <div id="wrap">
      <canvas id="c"></canvas>
      <div class="overlay" id="start">
        <h2>Boba Merge</h2>
        <p>Swipe to slide drinks. Matching ones merge. Help Bobo build the Ultimate Boba!</p>
        <button id="go">Play</button>
      </div>
      <div class="overlay hide" id="over">
        <h2>Spilled!</h2>
        <p id="final"></p>
        <button id="again">Play again</button>
      </div>
    </div>
    <div id="side">
      <canvas id="bear"></canvas>
      <canvas id="cup"></canvas>
      <div id="stage"></div>
    </div>
  </div>
  <p id="hint">Swipe or use arrow keys / WASD</p>
</div>
<script>
(function(){
  var N=4, SW=92;
  var NAMES=['Pearl','Ice','Lychee','Milk','Matcha','Taro','Brown sugar','Mango','Berry','Cup','ULTIMATE'];
  var COLORS=['#4a3228','#bfe6f2','#f6d9e4','#fbf3e6','#a9d18e','#b48bd9','#c58a4f','#ffc94d','#f2788f','#8fd3c8','#ffd34d'];
  var DARK=[true,false,false,false,false,false,true,false,false,false,false];
  var STEPS=['Add tapioca pearls','Add ice','Add lychee jelly','Pour milk','Stir in matcha','Swirl in taro','Drizzle brown sugar','Add mango','Top with berry','Seal the cup','Ultimate Boba!'];
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var bc=document.getElementById('bear'), bctx=bc.getContext('2d');
  var pc=document.getElementById('cup'), pctx=pc.getContext('2d');
  var scoreEl=document.getElementById('score'), bestEl=document.getElementById('best'), stageEl=document.getElementById('stage');
  var grid, score, best=0, over, started=false, size=300, pad, cell, anim=[];
  var maxLvl=0, shown=0, happyUntil=0, winUntil=0, bounce=0, won=false;

  try{best=parseInt(localStorage.getItem('bobaMergeBest'),10)||0;}catch(e){}
  bestEl.textContent=best;

  function setup(canvas,g,w,h){
    var d=window.devicePixelRatio||1;
    canvas.style.width=w+'px';canvas.style.height=h+'px';
    canvas.width=w*d;canvas.height=h*d;g.setTransform(d,0,0,d,0,0);
  }
  function resize(){
    var s=Math.min(window.innerWidth-24-SW-12, window.innerHeight-230, 440);
    size=Math.max(200,Math.floor(s));
    setup(cv,ctx,size,size);
    setup(bc,bctx,SW,88);
    setup(pc,pctx,SW,Math.max(120,Math.min(170,size-110)));
    pad=size*0.03; cell=(size-pad*5)/4;
  }

  function newGame(){
    grid=[];for(var r=0;r<N;r++){grid.push([null,null,null,null]);}
    score=0;over=false;anim=[];won=false;winUntil=0;happyUntil=0;
    spawn();spawn();update();
  }
  function empties(){var e=[];for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(!grid[r][c])e.push([r,c]);return e;}
  function spawn(){
    var e=empties();if(!e.length)return;
    var p=e[Math.floor(Math.random()*e.length)];
    grid[p[0]][p[1]]={v:Math.random()<0.9?2:4};
    anim.push({r:p[0],c:p[1],t:performance.now()});
  }
  function lvlOf(v){return Math.min(Math.round(Math.log(v)/Math.LN2)-1,10);}
  function update(){
    scoreEl.textContent=score;
    if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('bobaMergeBest',best);}catch(e){}}
    var m=0;for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(grid[r][c])m=Math.max(m,lvlOf(grid[r][c].v));
    maxLvl=m;
    stageEl.textContent=m>=10?STEPS[10]:'Next: '+STEPS[m+1]+' ('+NAMES[m+1]+' tile)';
  }

  // dir: 0 left, 1 up, 2 right, 3 down
  function move(dir){
    if(over||!started)return;
    var changed=false, gained=0, now=performance.now();
    for(var i=0;i<N;i++){
      var line=[],pos=[];
      for(var j=0;j<N;j++){
        var r,c;
        if(dir===0){r=i;c=j;}else if(dir===2){r=i;c=N-1-j;}
        else if(dir===1){r=j;c=i;}else{r=N-1-j;c=i;}
        pos.push([r,c]);line.push(grid[r][c]);
      }
      var t=line.filter(Boolean),out=[];
      for(var k=0;k<t.length;k++){
        var a=t[k],b=t[k+1];
        if(b&&a.v===b.v){out.push({v:a.v*2,m:true});gained+=a.v*2;k++;}
        else out.push({v:a.v});
      }
      for(var j2=0;j2<N;j2++){
        var o=out[j2]||null,p=pos[j2],old=grid[p[0]][p[1]];
        if((o&&!old)||(!o&&old)||(o&&old&&o.v!==old.v))changed=true;
        grid[p[0]][p[1]]=o;
        if(o&&o.m){anim.push({r:p[0],c:p[1],t:now});delete o.m;}
      }
    }
    if(!changed)return;
    score+=gained;
    if(gained){happyUntil=now+700;bounce=1;}
    spawn();update();
    if(maxLvl>=10&&!won){won=true;winUntil=now+4000;}
    if(!canMove()){over=true;setTimeout(showOver,350);}
  }
  function canMove(){
    for(var r=0;r<N;r++)for(var c=0;c<N;c++){
      var t=grid[r][c];
      if(!t)return true;
      if(c<N-1&&grid[r][c+1]&&grid[r][c+1].v===t.v)return true;
      if(r<N-1&&grid[r+1][c]&&grid[r+1][c].v===t.v)return true;
    }
    return false;
  }
  function showOver(){
    document.getElementById('final').textContent='Score '+score+'  ·  Best '+best;
    document.getElementById('over').classList.remove('hide');
  }

  function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);
    g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

  function drawBoard(now){
    ctx.clearRect(0,0,size,size);
    for(var r=0;r<N;r++)for(var c=0;c<N;c++){
      var x=pad+c*(cell+pad),y=pad+r*(cell+pad);
      ctx.fillStyle='rgba(255,255,255,.35)';rr(ctx,x,y,cell,cell,cell*.18);ctx.fill();
      var t=grid[r][c];if(!t)continue;
      var sc=1;
      for(var a=0;a<anim.length;a++){
        var an=anim[a];
        if(an.r===r&&an.c===c){var k=(now-an.t)/160;if(k<1)sc=0.6+0.55*Math.sin(k*Math.PI*0.5)+(k>0.7?-0.15*(k-0.7)/0.3:0);}
      }
      ctx.save();ctx.translate(x+cell/2,y+cell/2);ctx.scale(sc,sc);drawTile(t.v);ctx.restore();
    }
    anim=anim.filter(function(a){return now-a.t<200;});
  }
  function drawTile(v){
    var lvl=lvlOf(v),h=cell/2;
    ctx.fillStyle=COLORS[lvl];rr(ctx,-h,-h,cell,cell,cell*.18);ctx.fill();
    var n=Math.min(lvl+1,6),pr=cell*.05;
    ctx.fillStyle=DARK[lvl]?'#e9d3c0':'#4a3228';
    for(var i=0;i<n;i++){ctx.beginPath();ctx.arc(-h+cell*.14+i*(cell*.72/5.5),h-cell*.13,pr,0,7);ctx.fill();}
    ctx.fillStyle=DARK[lvl]?'#fff':'#3b2a4d';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold '+(v>=1000?cell*.3:cell*.38)+'px "Trebuchet MS",sans-serif';
    ctx.fillText(v,0,-cell*.08);
    ctx.font='bold '+cell*.12+'px "Trebuchet MS",sans-serif';
    ctx.fillText(NAMES[lvl],0,cell*.24);
  }

  // the cup on the side fills up as you reach new drinks
  function drawCup(now){
    var g=pctx,w=SW,H=pc.height/(window.devicePixelRatio||1);
    g.clearRect(0,0,w,H);
    var target=Math.min(maxLvl+1,9);
    shown+=(target-shown)*0.08;if(Math.abs(target-shown)<0.01)shown=target;
    var top=H*0.2,bot=H-8,tw=60,bw=42,cx=w/2;
    g.save();
    g.beginPath();g.moveTo(cx-tw/2,top);g.lineTo(cx+tw/2,top);g.lineTo(cx+bw/2,bot);g.lineTo(cx-bw/2,bot);g.closePath();
    g.fillStyle='rgba(255,255,255,.55)';g.fill();g.clip();
    var lh=(bot-top)/9;
    for(var i=0;i<9;i++){
      var amt=Math.max(0,Math.min(1,shown-i));if(amt<=0)continue;
      var y=bot-(i+amt)*lh;
      g.fillStyle=COLORS[i];g.fillRect(0,y,w,lh*amt+1);
      if(i===0){g.fillStyle='#e9d3c0';for(var p=0;p<5;p++){g.beginPath();g.arc(cx-16+p*8,bot-lh*0.5*amt,2.2,0,7);g.fill();}}
      if(i===1){g.fillStyle='rgba(255,255,255,.7)';g.fillRect(cx-14,y+2,9,7);g.fillRect(cx+4,y+3,9,7);}
    }
    g.restore();
    g.lineWidth=3;g.strokeStyle='#3b2a4d';g.lineJoin='round';
    g.beginPath();g.moveTo(cx-tw/2,top);g.lineTo(cx+tw/2,top);g.lineTo(cx+bw/2,bot);g.lineTo(cx-bw/2,bot);g.closePath();g.stroke();
    // straw always, lid once sealed
    g.strokeStyle='#ef6f8e';g.lineWidth=5;g.lineCap='round';
    g.beginPath();g.moveTo(cx+8,top+18);g.lineTo(cx+16,top-14);g.lineTo(cx+26,top-18);g.stroke();
    if(maxLvl>=9){
      g.fillStyle='#8fd3c8';g.strokeStyle='#3b2a4d';g.lineWidth=3;
      g.beginPath();g.ellipse(cx,top-2,tw/2+3,6,0,Math.PI,0);g.fill();g.stroke();
    }
    if(maxLvl>=10){
      g.fillStyle='#ffd34d';
      for(var s=0;s<4;s++){
        var a=now/400+s*1.6,sx=cx+Math.cos(a)*38,sy=H*0.5+Math.sin(a*1.3)*30,r=3+Math.sin(now/150+s)*1.5;
        g.beginPath();g.arc(sx,sy,r,0,7);g.fill();
      }
    }
  }

  // Bobo the bear
  function drawBear(now){
    var g=bctx;g.clearRect(0,0,SW,88);
    bounce*=0.9;
    var happy=now<happyUntil, win=now<winUntil, sad=over;
    var dy=-Math.sin(now/100)*bounce*6;
    g.save();g.translate(SW/2,50+dy);
    var fur='#b07a4f',cream='#f4dcc0',ink='#3b2a4d';
    g.fillStyle=fur;
    g.beginPath();g.arc(-24,-24,12,0,7);g.fill();g.beginPath();g.arc(24,-24,12,0,7);g.fill();
    g.fillStyle='#f2a5b5';
    g.beginPath();g.arc(-24,-24,6,0,7);g.fill();g.beginPath();g.arc(24,-24,6,0,7);g.fill();
    g.fillStyle=fur;g.beginPath();g.arc(0,0,32,0,7);g.fill();
    g.fillStyle=cream;g.beginPath();g.ellipse(0,10,15,11,0,0,7);g.fill();
    g.fillStyle='rgba(242,120,143,.55)';
    g.beginPath();g.arc(-22,8,5,0,7);g.fill();g.beginPath();g.arc(22,8,5,0,7);g.fill();
    // eyes
    g.fillStyle=ink;g.strokeStyle=ink;g.lineWidth=2.5;g.lineCap='round';
    var blink=(now%3200)<140;
    [-12,12].forEach(function(ex){
      if(win){g.fillStyle='#ffd34d';g.beginPath();g.arc(ex,-6,5,0,7);g.fill();g.fillStyle=ink;g.beginPath();g.arc(ex,-6,2,0,7);g.fill();}
      else if(happy){g.beginPath();g.arc(ex,-5,4,Math.PI*1.1,Math.PI*1.9);g.stroke();}
      else if(blink){g.beginPath();g.moveTo(ex-4,-6);g.lineTo(ex+4,-6);g.stroke();}
      else if(sad){g.beginPath();g.arc(ex,-5,3.5,0,7);g.fill();g.beginPath();g.moveTo(ex-5,-13);g.lineTo(ex+5,-11);g.stroke();}
      else{g.beginPath();g.arc(ex,-6,3.5,0,7);g.fill();}
    });
    g.fillStyle=ink;g.beginPath();g.ellipse(0,6,5,3.6,0,0,7);g.fill();
    g.beginPath();
    if(sad){g.arc(0,19,5,Math.PI*1.15,Math.PI*1.85);}
    else if(happy||win){g.arc(0,10,6,Math.PI*0.1,Math.PI*0.9);}
    else{g.arc(0,10,4,Math.PI*0.15,Math.PI*0.85);}
    g.stroke();
    if(sad){g.fillStyle='#8fd0ff';g.beginPath();g.ellipse(-14,5,2.5,4,0,0,7);g.fill();}
    g.restore();
  }

  function frame(now){drawBoard(now);drawCup(now);drawBear(now);requestAnimationFrame(frame);}

  // input: swipe and keys
  var sx=null,sy=null;
  cv.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY;e.preventDefault();});
  cv.addEventListener('pointercancel',function(){sx=null;});
  cv.addEventListener('pointerup',function(e){
    if(sx==null)return;
    var dx=e.clientX-sx,dy=e.clientY-sy,ax=Math.abs(dx),ay=Math.abs(dy);sx=null;
    if(Math.max(ax,ay)<20)return;
    if(ax>ay)move(dx<0?0:2);else move(dy<0?1:3);
  });
  document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('keydown',function(e){
    var m={ArrowLeft:0,a:0,ArrowUp:1,w:1,ArrowRight:2,d:2,ArrowDown:3,s:3}[e.key];
    if(m!==undefined){e.preventDefault();move(m);}
  });
  document.getElementById('go').onclick=function(){
    document.getElementById('start').classList.add('hide');started=true;newGame();};
  document.getElementById('again').onclick=function(){
    document.getElementById('over').classList.add('hide');newGame();};

  window.addEventListener('resize',resize);
  resize();newGame();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
